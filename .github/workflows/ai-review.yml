name: AI Code Review

on:
  push:
    branches-ignore:
      - main

permissions:
  contents: write

concurrency:
  group: ai-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ai-review:
    name: Review push diff with OpenAI
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: gpt-4o-mini
      LOG_LEVEL: INFO
      DIFF_OUTPUT: artifacts/push.diff
      FILES_OUTPUT: artifacts/changed_files.txt
      REVIEW_RESULT_FILE: artifacts/review_result.json
      REVIEW_BASE_SHA: origin/main
      REVIEW_HEAD_SHA: ${{ github.sha }}
      BRANCH_NAME: ${{ github.ref_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Generate push diff against main
        id: diff
        run: |
          python scripts/generate_diff.py \
            --base "${REVIEW_BASE_SHA}" \
            --head "${REVIEW_HEAD_SHA}" \
            --output "${DIFF_OUTPUT}" \
            --files-output "${FILES_OUTPUT}"

      - name: Run AI review
        id: review
        run: |
          set +e
          python scripts/run_ai_review.py --diff-file "${DIFF_OUTPUT}" --result-file "${REVIEW_RESULT_FILE}"
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
        continue-on-error: true

      - name: Publish review feedback
        if: always()
        run: |
          python scripts/publish_review.py --result-file "${REVIEW_RESULT_FILE}"

      - name: Configure git for squash merge
        if: steps.review.outputs.exit_code == '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Squash merge into main on PASS
        if: steps.review.outputs.exit_code == '0'
        run: |
          python scripts/merge_branch.py \
            --result-file "${REVIEW_RESULT_FILE}" \
            --branch "${BRANCH_NAME}"

      - name: Upload review artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-review-${{ github.ref_name }}-${{ github.sha }}
          path: artifacts/
          if-no-files-found: warn

      - name: Fail job when review is FAIL
        if: steps.review.outputs.exit_code != '0'
        run: |
          echo "AI review decision is FAIL (exit ${{ steps.review.outputs.exit_code }}). Merge blocked."
          exit 1
